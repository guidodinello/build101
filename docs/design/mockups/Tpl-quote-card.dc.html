<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Template quote_card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: {{background}}; color: {{text}}; font-family: Figtree, sans-serif">
  <div style="position: absolute; left: 64px; right: 64px; top: 140px; height: 800px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; text-align: center">
    <div aria-hidden="true" style="font: 600 260px/0.6 Fraunces, serif; color: {{accent}}; height: 120px">“</div>
    <div style="font: 600 78px/1.12 Fraunces, serif; letter-spacing: -0.01em; max-width: 860px">Un mueble bien hecho no se cambia: se hereda.</div>
    <div style="font-size: 36px; opacity: 0.85">— El taller de Muebles Ramírez</div>
  </div>
  <svg role="img" aria-label="Foto: banco de trabajo del taller" width="1080" height="270" viewBox="0 0 400 100" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; bottom: 0">
    <rect x="0" y="0" width="400" height="100" fill="#8E6E52"></rect>
    <rect x="0" y="0" width="400" height="38" fill="#A98263"></rect>
    <rect x="20" y="38" width="360" height="10" fill="#5A3920"></rect>
    <rect x="70" y="20" width="60" height="18" rx="2" fill="#C9A47A"></rect>
    <rect x="160" y="26" width="90" height="12" rx="2" fill="#D8C6AA"></rect>
    <rect x="280" y="10" width="6" height="28" fill="#3E2C1E"></rect>
    <rect x="300" y="14" width="6" height="24" fill="#3E2C1E"></rect>
  </svg>
  <div style="position: absolute; right: 64px; bottom: 56px; width: 160px; padding: 14px 0; border-radius: 16px; background: rgba(31,27,22,0.45); color: #F3EBDD; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="width: 72px; height: 72px; border-radius: 50%; border: 3px solid #F3EBDD; display: flex; align-items: center; justify-content: center; font: 600 28px Fraunces, serif">MR</div>
    <div style="font: 600 14px Fraunces, serif; letter-spacing: 0.14em">MUEBLES RAMÍREZ</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"background":{"editor":"color","default":"#F3EBDD","options":["#F3EBDD","#4F5D2F","#FFFFFF"]},"text":{"editor":"color","default":"#4F5D2F","options":["#4F5D2F","#1F1B16","#F3EBDD"]},"accent":{"editor":"color","default":"#C89B6D","options":["#C89B6D","#4F5D2F","#F2B84B"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      background: this.props.background ?? '#F3EBDD',
      text: this.props.text ?? '#4F5D2F',
      accent: this.props.accent ?? '#C89B6D'
    };
  }
}
</script>
</body>
</html>
