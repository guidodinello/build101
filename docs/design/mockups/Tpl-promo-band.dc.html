<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Template promo_band</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #E2D3BC; font-family: Figtree, sans-serif">
  <svg role="img" aria-label="Foto: silla de madera maciza" width="1080" height="837" viewBox="0 0 400 310" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0">
    <rect x="0" y="0" width="400" height="230" fill="#E2D3BC"></rect>
    <rect x="0" y="230" width="400" height="80" fill="#A98263"></rect>
    <rect x="160" y="40" width="12" height="230" rx="3" fill="#6B4428"></rect>
    <rect x="160" y="40" width="90" height="12" rx="3" fill="#6B4428"></rect>
    <rect x="160" y="80" width="90" height="8" rx="3" fill="#7A5232"></rect>
    <rect x="160" y="160" width="110" height="14" rx="3" fill="#6B4428"></rect>
    <rect x="256" y="174" width="12" height="96" rx="3" fill="#5A3920"></rect>
    <rect x="238" y="40" width="12" height="122" rx="3" fill="#6B4428"></rect>
  </svg>
  <div style="position: absolute; left: 64px; top: 64px; padding: 22px 34px; border-radius: 18px; background: {{accent}}; color: {{background}}; font: 700 64px/1 Figtree, sans-serif; letter-spacing: -0.01em">15% OFF</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 513px; box-sizing: border-box; padding: 60px 64px 64px; background: {{background}}; color: {{text}}; display: flex; flex-direction: column; gap: 18px">
    <div style="font: 600 92px/1 Fraunces, serif; letter-spacing: -0.01em">15% en sillas</div>
    <div style="font-size: 38px; line-height: 1.25">Solo este sábado y domingo</div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end">
      <div style="padding: 20px 34px; border-radius: 999px; background: #C89B6D; color: #1F1B16; font-size: 32px; font-weight: 600">Escribinos por WhatsApp</div>
      <div style="width: 160px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 84px; height: 84px; border-radius: 50%; border: 3px solid {{text}}; display: flex; align-items: center; justify-content: center; font: 600 32px Fraunces, serif">MR</div>
        <div style="font: 600 16px Fraunces, serif; letter-spacing: 0.14em">MUEBLES RAMÍREZ</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"background":{"editor":"color","default":"#4F5D2F","options":["#4F5D2F","#6B4428","#1F1B16"]},"text":{"editor":"color","default":"#F3EBDD","options":["#F3EBDD","#FFFFFF","#111111"]},"accent":{"editor":"color","default":"#F3EBDD","options":["#F3EBDD","#C89B6D","#F2B84B"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      background: this.props.background ?? '#4F5D2F',
      text: this.props.text ?? '#F3EBDD',
      accent: this.props.accent ?? '#F3EBDD'
    };
  }
}
</script>
</body>
</html>
