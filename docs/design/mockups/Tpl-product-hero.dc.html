<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Template product_hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #D8C6AA; font-family: Figtree, sans-serif">
  <svg role="img" aria-label="Foto: mesa Nórdica en un comedor" width="1080" height="1350" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0">
    <rect x="0" y="0" width="400" height="330" fill="#D8C6AA"></rect>
    <rect x="250" y="40" width="110" height="160" fill="#EFE5D3"></rect>
    <line x1="305" y1="40" x2="305" y2="200" stroke="#D8C6AA" stroke-width="3"></line>
    <rect x="0" y="330" width="400" height="170" fill="#9C7656"></rect>
    <line x1="165" y1="0" x2="165" y2="120" stroke="#3E2C1E" stroke-width="1.5"></line>
    <path d="M140 140 a25 22 0 0 1 50 0 z" fill="#3E2C1E"></path>
    <rect x="176" y="232" width="22" height="40" rx="8" fill="#4F5D2F"></rect>
    <rect x="60" y="270" width="270" height="16" rx="3" fill="#6B4428"></rect>
    <rect x="82" y="286" width="12" height="120" fill="#5A3920"></rect>
    <rect x="296" y="286" width="12" height="120" fill="#5A3920"></rect>
  </svg>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: {{scrim}}"></div>
  <div style="position: absolute; left: 64px; right: 64px; bottom: 64px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; color: {{text}}">
    <div style="display: flex; flex-direction: column; gap: 18px; max-width: 700px">
      <div style="font: 600 96px/0.98 Fraunces, serif; letter-spacing: -0.01em">Mesa Nórdica</div>
      <div style="font-size: 38px; line-height: 1.25">Roble macizo, hecha a mano en Montevideo</div>
    </div>
    <div style="width: 160px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 96px; height: 96px; border-radius: 50%; border: 3px solid {{text}}; display: flex; align-items: center; justify-content: center; font: 600 36px Fraunces, serif">MR</div>
      <div style="font: 600 18px Fraunces, serif; letter-spacing: 0.14em">MUEBLES RAMÍREZ</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"background":{"editor":"color","default":"#4F5D2F","options":["#4F5D2F","#6B4428","#1F1B16"]},"text":{"editor":"color","default":"#F3EBDD","options":["#F3EBDD","#FFFFFF","#111111"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const bg = this.props.background ?? '#4F5D2F';
    return {
      text: this.props.text ?? '#F3EBDD',
      scrim: 'linear-gradient(180deg, ' + bg + '00 0%, ' + bg + 'D9 55%)'
    };
  }
}
</script>
</body>
</html>
