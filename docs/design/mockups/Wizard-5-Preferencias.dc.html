<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Onboarding: preferencias</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F5C}a:hover{color:#164F42}
.q{display:flex;flex-direction:column;gap:10px;padding:14px;background:#FFFFFF;border:1px solid #EAE3D8;border-radius:14px}
.qt{font-size:15px;font-weight:600;color:#1F1B16}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.c{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid #DDD3C5;background:#FFFFFF;color:#1F1B16;font:500 14px Figtree,sans-serif;display:flex;align-items:center;gap:6px}
.c.on{background:#1F6F5C;border-color:#1F6F5C;color:#FFFFFF}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:#6B6257}
.track{position:relative;height:6px;border-radius:3px;background:#E7DFD3;margin:10px 0 6px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#1F6F5C}
.thumb{position:absolute;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#FFFFFF;border:2px solid #1F6F5C;box-sizing:border-box}
.seg{flex:1;height:44px;border:none;border-radius:11px;background:none;font:600 16px Figtree,sans-serif;color:#1F1B16}
.seg.on{background:#FFFFFF;color:#1F6F5C;box-shadow:0 1px 3px rgba(31,27,22,.15)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; font-family: Figtree, sans-serif; color: #1F1B16; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Paso anterior" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: none; color: #1F1B16; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div style="font-size: 13px; font-weight: 600; color: #6B6257">Paso 5 de 6</div>
      <a href="#" style="display: flex; align-items: center; gap: 5px; height: 44px; font-size: 13px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1121 11.5z"></path></svg>WhatsApp</a>
    </div>
    <div role="progressbar" aria-label="Progreso" aria-valuenow="5" aria-valuemin="0" aria-valuemax="6" style="height: 6px; border-radius: 3px; background: #E7DFD3; overflow: hidden"><div style="width: 83.3%; height: 100%; background: #1F6F5C; border-radius: 3px"></div></div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 22px 16px 16px; overflow: hidden">
    <h1 style="margin: 0 0 4px; font: 700 28px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em">¿Cómo querés que suene?</h1>
    <div class="q">
      <div class="qt">¿Qué querés lograr con tus redes?</div>
      <div class="chips">
        <button class="c on" aria-pressed="true"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Más consultas y ventas</button>
        <button class="c" aria-pressed="false">Que me conozca más gente</button>
        <button class="c" aria-pressed="false">Lanzar algo nuevo</button>
        <button class="c" aria-pressed="false">Fidelizar clientes</button>
      </div>
    </div>
    <div class="q">
      <div class="qt">¿A quién le vendés? <span style="font-weight: 400; color: #6B6257">(podés elegir varios)</span></div>
      <div class="chips">
        <button class="c on" aria-pressed="true"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Familias</button>
        <button class="c on" aria-pressed="true"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Parejas jóvenes</button>
        <button class="c" aria-pressed="false">Empresas</button>
        <button class="c" aria-pressed="false">Arquitectos</button>
        <button class="c" aria-pressed="false">Otro</button>
      </div>
    </div>
    <div class="q">
      <div class="qt">El tono</div>
      <div>
        <div class="track" role="slider" aria-label="Formal a cercano" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="fill" style="width: 80%"></div><div class="thumb" style="left: 80%"></div></div>
        <div class="ends"><span>Formal</span><span>Cercano</span></div>
      </div>
      <div>
        <div class="track" role="slider" aria-label="Serio a divertido" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="fill" style="width: 45%"></div><div class="thumb" style="left: 45%"></div></div>
        <div class="ends"><span>Serio</span><span>Divertido</span></div>
      </div>
    </div>
    <div class="q">
      <div class="qt">¿Cuántas publicaciones por semana?</div>
      <div style="display: flex; gap: 4px; padding: 4px; background: #EFE9E0; border-radius: 14px">
        <button class="seg" aria-pressed="false">2</button>
        <button class="seg on" aria-pressed="true">3</button>
        <button class="seg" aria-pressed="false">5</button>
      </div>
    </div>
    <div class="q">
      <div class="qt">¿Usamos emojis?</div>
      <div class="chips">
        <button class="c" aria-pressed="false">Sí, bastantes</button>
        <button class="c on" aria-pressed="true">Pocos</button>
        <button class="c" aria-pressed="false">Ninguno</button>
      </div>
    </div>
  </div>
  <div style="padding: 12px 16px 20px; border-top: 1px solid #EAE3D8; background: #FAF7F2">
    <button style="width: 100%; height: 56px; border: none; border-radius: 14px; background: #1F6F5C; color: #FFFFFF; font: 600 17px Figtree, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">Siguiente<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {

  }

</script>
</body>
</html>
