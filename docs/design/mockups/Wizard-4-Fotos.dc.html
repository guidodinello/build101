<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Onboarding: fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F5C}a:hover{color:#164F42}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}
.rm{position:absolute;top:2px;right:2px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(31,27,22,.6);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
.tag{position:absolute;left:8px;bottom:7px;font-size:11px;font-weight:600;color:#FFFFFF;letter-spacing:.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; font-family: Figtree, sans-serif; color: #1F1B16; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Paso anterior" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: none; color: #1F1B16; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div style="font-size: 13px; font-weight: 600; color: #6B6257">Paso 4 de 6</div>
      <a href="#" style="display: flex; align-items: center; gap: 5px; height: 44px; font-size: 13px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1121 11.5z"></path></svg>WhatsApp</a>
    </div>
    <div role="progressbar" aria-label="Progreso" aria-valuenow="4" aria-valuemin="0" aria-valuemax="6" style="height: 6px; border-radius: 3px; background: #E7DFD3; overflow: hidden"><div style="width: 66.6%; height: 100%; background: #1F6F5C; border-radius: 3px"></div></div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 22px 16px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font: 700 28px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em">Tus fotos</h1>
      <div style="font-size: 15px; line-height: 1.4; color: #6B6257">Productos, el taller, el equipo. Las de tu Instagram las traemos solas en el paso 6.</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 14px; font-weight: 600">7 de 15</div>
      <div style="font-size: 13px; color: #6B6257">Mínimo 3</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="tile" style="border: 1.5px dashed #BFB3A3; background: #FFFFFF; color: #1F6F5C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 13px Figtree, sans-serif; padding: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Agregar</button>
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="7">
        <div class="tile" style="background: {{p.tone}}">
          <svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%"><rect x="0" y="62" width="100" height="38" fill="rgba(31,27,22,0.18)"></rect><rect x="22" y="44" width="56" height="7" rx="2" fill="rgba(31,27,22,0.45)"></rect><rect x="28" y="51" width="4" height="26" fill="rgba(31,27,22,0.4)"></rect><rect x="68" y="51" width="4" height="26" fill="rgba(31,27,22,0.4)"></rect></svg>
          <span class="tag">{{p.label}}</span>
          <sc-if value="{{p.uploading}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; inset: 0; background: rgba(250,247,242,0.55); display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="Subiendo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F6F5C" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 019 9" opacity="1"></path><path d="M21 12a9 9 0 11-9-9" opacity="0.25"></path></svg></div>
          </sc-if>
          <sc-if value="{{p.failed}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; inset: 0; background: rgba(194,65,12,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 01-14 5.3L4 15"></path></svg>Reintentar</div>
          </sc-if>
          <button class="rm" aria-label="Quitar foto {{p.label}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; padding: 12px 14px; background: #F7EBD2; border-radius: 14px; font-size: 13.5px; line-height: 1.4; color: #4A3B1E">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
      Usamos tus fotos reales en los posts. Nada se publica sin que lo apruebes.
    </div>
  </div>
  <div style="padding: 12px 16px 20px; border-top: 1px solid #EAE3D8; background: #FAF7F2">
    <button style="width: 100%; height: 56px; border: none; border-radius: 14px; background: #1F6F5C; color: #FFFFFF; font: 600 17px Figtree, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">Siguiente<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      photos: [
        { label: 'Mesa Nórdica', tone: '#B98A5E' },
        { label: 'Taller', tone: '#8E6E52' },
        { label: 'Sillas', tone: '#C9A47A' },
        { label: 'Rack TV', tone: '#A27B5A' },
        { label: 'Equipo', tone: '#7D6A55' },
        { label: 'Detalle', tone: '#B0916F', uploading: true },
        { label: 'Living', tone: '#9A7B60', failed: true }
      ]
    };
  }
}
</script>
</body>
</html>
