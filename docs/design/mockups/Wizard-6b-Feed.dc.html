<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Onboarding: importar el feed de Instagram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F5C}a:hover{color:#164F42}
.tile{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:10px;overflow:hidden;display:block;width:100%}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D9CFC1;background:#FFFFFF;color:#1F1B16;font:600 13.5px Figtree,sans-serif;display:flex;align-items:center;gap:6px}
.chip.on{background:#1F1B16;border-color:#1F1B16;color:#FAF7F2}
.chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; font-family: Figtree, sans-serif; color: #1F1B16; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Paso anterior" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: none; color: #1F1B16; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div style="font-size: 13px; font-weight: 600; color: #6B6257">Paso 6 de 6</div>
      <a href="#" style="display: flex; align-items: center; gap: 5px; height: 44px; font-size: 13px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1121 11.5z"></path></svg>WhatsApp</a>
    </div>
    <div role="progressbar" aria-label="Progreso" aria-valuenow="6" aria-valuemin="0" aria-valuemax="6" style="height: 6px; border-radius: 3px; background: #E7DFD3; overflow: hidden"><div style="width: 100%; height: 100%; background: #1F6F5C; border-radius: 3px"></div></div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font: 700 28px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em">Trajimos tu feed</h1>
      <div style="font-size: 15px; line-height: 1.4; color: #6B6257">Fotos y videos de <b style="color: #1F1B16">@mueblesramirez</b>. Destildá lo que no quieras que usemos.</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: #FFFFFF; border: 1px solid #EAE3D8; border-radius: 12px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Importando…</span><span style="color: #6B6257">{{done}} de {{total}}</span></div>
      <div role="progressbar" aria-label="Importación del feed" aria-valuenow="{{done}}" aria-valuemin="0" aria-valuemax="{{total}}" style="height: 5px; border-radius: 3px; background: #E7DFD3; overflow: hidden"><div style="width: 70%; height: 100%; background: #1F6F5C"></div></div>
    </div>
    <div style="display: flex; gap: 8px">
      <button class="chip on">Todo · {{total}}</button>
      <button class="chip">Fotos · {{photos}}</button>
      <button class="chip">Videos · {{videos}}</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{items}}" as="m" hint-placeholder-count="12">
        <button class="tile" aria-label="{{m.label}}" style="background: {{m.tone}}; opacity: {{m.op}}">
          <svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%"><rect x="0" y="64" width="100" height="36" fill="rgba(31,27,22,0.18)"></rect><rect x="24" y="46" width="52" height="7" rx="2" fill="rgba(31,27,22,0.42)"></rect><rect x="30" y="53" width="4" height="24" fill="rgba(31,27,22,0.38)"></rect><rect x="66" y="53" width="4" height="24" fill="rgba(31,27,22,0.38)"></rect></svg>
          <sc-if value="{{m.video}}" hint-placeholder-val="{{false}}">
            <span class="badge"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg>{{m.dur}}</span>
          </sc-if>
          <sc-if value="{{m.album}}" hint-placeholder-val="{{false}}">
            <span class="badge"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h3"></path></svg>{{m.count}}</span>
          </sc-if>
          <span class="chk" style="background: {{m.chkBg}}; box-shadow: inset 0 0 0 1.5px #FFFFFF"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="opacity: {{m.chkOp}}"><path d="M5 12l5 5 9-10"></path></svg></span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; padding: 11px 13px; background: #F7EBD2; border-radius: 14px; font-size: 13px; line-height: 1.4; color: #4A3B1E">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
      Lo usamos para entender tu estilo y armar posts con tu material. Las historias y lo que subas después también te lo podemos ir trayendo.
    </div>
  </div>
  <div style="padding: 12px 16px 20px; border-top: 1px solid #EAE3D8; background: #FAF7F2">
    <button style="width: 100%; height: 56px; border: none; border-radius: 14px; background: #1F6F5C; color: #FFFFFF; font: 600 17px Figtree, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">Listo, seguir<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { chkBg: '#1F6F5C', chkOp: 1, op: 1 };
    const off = { chkBg: 'rgba(31,27,22,0.35)', chkOp: 0, op: 0.45 };
    return {
      done: 42, total: 60, photos: 48, videos: 12,
      items: [
        { label: 'Foto: mesa Nórdica', tone: '#B98A5E', ...on },
        { label: 'Video: el taller por dentro', tone: '#8E6E52', video: true, dur: '0:24', ...on },
        { label: 'Carrusel: sillas', tone: '#C9A47A', album: true, count: '4', ...on },
        { label: 'Foto: rack TV', tone: '#A27B5A', ...on },
        { label: 'Foto: saludo de fin de año', tone: '#7D6A55', ...off },
        { label: 'Video: lijando roble', tone: '#B0916F', video: true, dur: '0:12', ...on },
        { label: 'Foto: living', tone: '#9A7B60', ...on },
        { label: 'Carrusel: antes y después', tone: '#BC9670', album: true, count: '3', ...on },
        { label: 'Foto: el equipo', tone: '#866B53', ...on },
        { label: 'Video: entrega en Pocitos', tone: '#A88462', video: true, dur: '0:31', ...on },
        { label: 'Foto: detalle de uniones', tone: '#C2A07E', ...on },
        { label: 'Foto: meme', tone: '#94775C', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
