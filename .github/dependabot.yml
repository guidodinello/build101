# Weekly version-update PRs, one grouped PR per ecosystem, at most two open at a
# time. `uv` is a native Dependabot ecosystem (it reads backend/uv.lock). `docker`
# keeps the digest-pinned base image in backend/Dockerfile moving, so the pin
# doesn't freeze its OS security patches.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Majors that break the toolchain, bumped by hand when it catches up:
    # typescript-eslint doesn't support TS 7 yet, eslint-config-next's plugins
    # cap their eslint peer at ^9, and @types/node should track the Node we run.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns:
          - "*"
