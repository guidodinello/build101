# Weekly version-update PRs, one grouped PR per ecosystem, at most two open at a
# time. `uv` is a native Dependabot ecosystem (it reads backend/uv.lock). `docker`
# keeps the digest-pinned base image in backend/Dockerfile moving, so the pin
# doesn't freeze its OS security patches.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns:
          - "*"
