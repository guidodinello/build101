# CI for build101. Adapted from guidodinello/dev-standards
# (templates/ci/python-ci.yml). Follows .claude/rules/ci.md: path filtering behind a
# `changes` job, least-privilege token, and one aggregate `CI` gate that a
# branch ruleset can require instead of every job name.
#
# Jobs check docs, workflows, the backend (ruff + pyright + pytest) and the frontend
# (typecheck + lint; the Vercel preview build covers `next build`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly dependency audit: an advisory can land against a lockfile nobody touched.
  schedule:
    - cron: '0 6 * * 1'

# Superseded pull_request runs are cancelled. Every other event gets a unique
# group, so a push to main is never dropped in favour of a newer pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    # A scheduled run only audits dependencies; the other jobs stay skipped.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      markdown: ${{ steps.filter.outputs.markdown }}
      workflows: ${{ steps.filter.outputs.workflows }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deps:
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.markdownlint.yaml'
              - '.markdownlintignore'
              - 'scripts/check_docs_index.py'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  lint-markdown:
    name: Lint Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Whole tree, not only changed files: it is fast, and a rule change in
      # .markdownlint.yaml must be checked against every file.
      - name: markdownlint
        run: npx --yes markdownlint-cli@0.49.0 '**/*.md' --dot --ignore node_modules --ignore .venv --ignore .git

  docs-index:
    name: Docs index
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      # Every docs/ folder has a README index that links its contents, and
      # every relative link resolves (AGENTS.md, Golden rules).
      - name: Check docs indexes and relative links
        run: uv run --no-project python scripts/check_docs_index.py

  lint-workflows:
    name: Lint Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  audit:
    name: Dependency audit
    needs: changes
    # `changes` is skipped on schedule runs, so this cannot rely on the implicit success check.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Audits the runtime closure the lock resolves for this runner (Linux), the
      # same one the Docker image gets. `uv audit` is still experimental and also
      # flags the Intel-Mac-only cryptography fork, so pip-audit reads an export.
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          uv export -q --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The onboarding API tests run against a real, throwaway Postgres (TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build101_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/build101_test
        run: uv run pytest tests/ -v

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `next typegen` first: tsc alone reports false errors until Next has
      # generated next-env.d.ts and .next/types.
      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # Single stable check name for the branch ruleset. if: always() so it still
  # runs (and fails) when a needed job fails; a skipped required check would
  # count as passing. Skipped jobs (path filter said no) pass.
  ci:
    name: CI
    needs:
      - audit
      - changes
      - lint-markdown
      - docs-index
      - lint-workflows
      - backend
      - frontend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
